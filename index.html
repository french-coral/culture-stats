<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culture Stats</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="dashboard">

  <header class="dashboard-header">
    <div>
      <h1>Culture Stats</h1>
      <p id="updated">Loading…</p>
    </div>

    <button id="theme-toggle" class="theme-toggle" type="button">
      ◐
    </button>
  </header>


  <!-- DATABASE -->

  <section class="controls card">
    <label for="database-select">Database</label>
    <select id="database-select"></select>
  </section>


  <!-- TOTAL -->

  <section class="card total-card">

    <div class="section-heading">
      <div>
        <h2>Total entries</h2>
        <p>Everything currently tracked</p>
      </div>
    </div>

    <div class="total-layout">

      <div class="donut-wrap">
        <div id="donut" class="donut">
          <div class="donut-center">
            <strong id="total-number">0</strong>
            <span>entries</span>
          </div>
        </div>
      </div>

      <div id="database-legend" class="database-legend"></div>

    </div>

  </section>


  <!-- ENTRIES / HEATMAP -->

  <section class="card activity-card">

    <div class="section-heading">

      <div>
        <h2>Entries over time</h2>
        <p id="activity-description">
          Entries added to your databases
        </p>
      </div>

      <div class="activity-controls">

        <div class="view-toggle">
          <button
            id="heatmap-toggle"
            class="view-button active"
            type="button"
          >
            Heatmap
          </button>

          <button
            id="curve-toggle"
            class="view-button"
            type="button"
          >
            Curve
          </button>
        </div>

        <div class="range-controls">

          <label>
            From
            <select id="year-from"></select>
          </label>

          <label>
            To
            <select id="year-to"></select>
          </label>

        </div>

      </div>

    </div>


    <div id="heatmap-view" class="activity-view active">

      <div class="heatmap-year-control">
        <select id="heatmap-year"></select>
      </div>

      <div id="heatmap" class="heatmap"></div>

    </div>


    <div id="curve-view" class="activity-view">

      <div id="year-chart" class="year-chart"></div>

    </div>

  </section>


  <!-- YEAR SUMMARY + RELEASE AGE -->

  <section class="stats-row">

    <div class="card year-summary-card">

      <div class="section-heading">

        <div>
          <h2>Year summary</h2>
          <p>Activity during a selected year</p>
        </div>

        <select id="summary-year"></select>

      </div>

      <div class="summary-grid">

        <div class="summary-stat">
          <span>Total</span>
          <strong id="summary-total">—</strong>
        </div>

        <div class="summary-stat">
          <span>Active months</span>
          <strong id="summary-months">—</strong>
        </div>

        <div class="summary-stat">
          <span>Average / active month</span>
          <strong id="summary-average">—</strong>
        </div>

      </div>

    </div>


    <div class="card release-age-card">

      <div class="section-heading">
        <div>
          <h2>Release age</h2>
          <p>Release → consumption</p>
        </div>
      </div>

      <div class="release-age">
        <strong id="release-age-value">—</strong>
        <span>years</span>
      </div>

      <p id="release-age-count" class="muted"></p>

    </div>

  </section>


  <!-- RATINGS -->

  <section class="card">

    <div class="section-heading">

      <div>
        <h2>Ratings</h2>
        <p id="rating-average">Average: —</p>
      </div>

    </div>

    <div id="rating-chart" class="rating-chart"></div>

  </section>

</main>


<div id="tooltip" class="tooltip"></div>

<script src="app.js"></script>

</body>
</html>
