<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culture Stats</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="dashboard">

  <!-- Header -->
  <header class="dashboard-header">
    <div>
      <h1>Culture Stats</h1>
      <p id="updated">Loading…</p>
    </div>

    <button id="theme-toggle" class="theme-toggle" type="button">
      ◐
    </button>
  </header>


  <!-- Database selector -->
  <section class="controls card">
    <label for="database-select">Database</label>

    <select id="database-select">
      <option value="all">All</option>
    </select>
  </section>


  <!-- Total + Year Summary -->
  <section class="stats-row">

    <!-- Total Entries -->
    <div class="card total-card">

      <div class="section-heading">
        <div>
          <h2>Total Entries</h2>
          <p id="total-description">All databases</p>
        </div>
      </div>

      <div class="total-content">

        <div id="total-donut" class="donut"></div>

        <div class="total-number">
          <strong id="total-value">—</strong>
          <span>entries</span>
        </div>

      </div>

      <div id="database-breakdown" class="database-breakdown"></div>

    </div>


    <!-- Year Summary -->
    <div class="card year-summary-card">

      <div class="section-heading">
        <div>
          <h2>Year Summary</h2>
          <p>Entries by consumption year</p>
        </div>
      </div>

      <div id="year-summary" class="year-summary"></div>

    </div>

  </section>


  <!-- Activity -->
  <section class="card activity-card">

    <div class="section-heading">

      <div>
        <h2>Entries over time</h2>
        <p id="activity-description">
          Entries added to your databases
        </p>
      </div>

      <div class="activity-controls">

        <div class="view-toggle">
          <button
            id="heatmap-toggle"
            class="view-button active"
            type="button"
          >
            Heatmap
          </button>

          <button
            id="curve-toggle"
            class="view-button"
            type="button"
          >
            Curve
          </button>
        </div>

        <div class="range-controls">
          <label>
            From
            <select id="year-from"></select>
          </label>

          <label>
            To
            <select id="year-to"></select>
          </label>
        </div>

      </div>

    </div>


    <!-- Heatmap -->
    <div id="heatmap-view" class="activity-view active">

      <div class="heatmap-year-control">
        <select id="heatmap-year"></select>
      </div>

      <div id="heatmap" class="heatmap"></div>

    </div>


    <!-- Curve -->
    <div id="curve-view" class="activity-view">

      <div id="year-chart" class="year-chart"></div>

    </div>

  </section>


  <!-- Release Age -->
  <section class="card release-age-card">

    <div class="section-heading">
      <div>
        <h2>Release Age</h2>
        <p>Release → consumption</p>
      </div>
    </div>

    <div class="release-age-grid">

      <div class="release-age-stat">
        <strong id="release-age-value">—</strong>
        <span>years average age</span>
      </div>

      <div class="release-year-stat">
        <strong id="release-year-value">—</strong>
        <span>average release year</span>
      </div>

    </div>

    <p id="release-age-count" class="muted"></p>

  </section>


  <!-- Ratings -->
  <section class="card ratings-card">

    <div class="section-heading">
      <div>
        <h2>Ratings</h2>
        <p>Distribution from −5 to +5</p>
      </div>
    </div>

    <div class="rating-summary">
      <div>
        <strong id="rating-average">—</strong>
        <span>average</span>
      </div>

      <div>
        <strong id="rating-total">—</strong>
        <span>rated</span>
      </div>
    </div>

    <div id="rating-chart" class="rating-chart"></div>

  </section>

</main>


<div id="tooltip" class="tooltip"></div>


<script src="app.js"></script>

</body>
</html>
